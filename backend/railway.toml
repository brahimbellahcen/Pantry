# Railway deployment configuration
# Deploy with: railway up
# Docs: https://docs.railway.app

[build]
builder = "DOCKERFILE"
dockerfilePath = "Dockerfile.backend.prod"
buildCommand = ""

[deploy]
startCommand = "alembic upgrade head && gunicorn app.main:app -k uvicorn.workers.UvicornWorker --workers 2 --bind 0.0.0.0:$PORT --timeout 60"
healthcheckPath = "/health"
healthcheckTimeout = 30
restartPolicyType = "ON_FAILURE"
restartPolicyMaxRetries = 3
