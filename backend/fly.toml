# Fly.io deployment (alternative)
# Deploy: fly launch --no-deploy, set secrets, then fly deploy
# Docs: https://fly.io/docs

app = "pantry-api"
primary_region = "iad"

[build]
  dockerfile = "Dockerfile.backend.prod"

[env]
  APP_ENV = "production"
  PORT = "8080"

[http_service]
  internal_port = 8000
  force_https = true
  auto_stop_machines = true
  auto_start_machines = true
  min_machines_running = 1
  processes = ["app"]

[[vm]]
  cpu_kind = "shared"
  cpus = 1
  memory_mb = 512
