# Render deployment manifest
# Deploy at: https://dashboard.render.com → New → Blueprint
# Docs: https://render.com/docs/blueprint-spec

services:
  # ── Backend API ───────────────────────────────────────────────────────────
  - type: web
    name: pantry-api
    runtime: docker
    dockerfilePath: ./Dockerfile.backend.prod
    dockerContext: ./backend
    plan: starter
    healthCheckPath: /health
    envVars:
      - key: DATABASE_URL
        fromDatabase:
          name: pantry-db
          property: connectionString
      - key: SECRET_KEY
        generateValue: true
      - key: APP_ENV
        value: production
      - key: APP_CORS_ORIGINS
        value: https://pantry-web.onrender.com
      - key: STRIPE_SECRET_KEY
        sync: false
      - key: STRIPE_WEBHOOK_SECRET
        sync: false
      - key: SMTP_HOST
        sync: false
      - key: SMTP_PORT
        value: "587"
      - key: SMTP_USER
        sync: false
      - key: SMTP_PASSWORD
        sync: false
      - key: SENTRY_DSN
        sync: false
    buildCommand: ""
    startCommand: >
      alembic upgrade head &&
      gunicorn app.main:app
      -k uvicorn.workers.UvicornWorker
      --workers 2 --bind 0.0.0.0:$PORT --timeout 60

  # ── Frontend ──────────────────────────────────────────────────────────────
  - type: web
    name: pantry-web
    runtime: static
    buildCommand: cd frontend && npm ci && npm run build
    staticPublishPath: ./frontend/dist
    envVars:
      - key: VITE_API_URL
        value: https://pantry-api.onrender.com/api/v1
      - key: VITE_STRIPE_PUBLISHABLE_KEY
        sync: false
    routes:
      - type: rewrite
        source: /*
        destination: /index.html

databases:
  - name: pantry-db
    plan: starter
    databaseName: pantry
    user: pantry
