# Render deployment — 100% free tier
# Deploy: https://dashboard.render.com → New → Blueprint → point to render.yaml

services:
  # ── Backend API (Free tier: spins down after 15 min inactivity) ───────────
  - type: web
    name: pantry-api
    runtime: docker
    dockerfilePath: ./Dockerfile.backend.prod
    dockerContext: ./backend
    plan: free
    healthCheckPath: /health
    envVars:
      - key: DATABASE_URL
        fromDatabase:
          name: pantry-db
          property: connectionString
      - key: SECRET_KEY
        generateValue: true
      - key: APP_ENV
        value: production
      - key: APP_CORS_ORIGINS
        value: https://pantry-web.vercel.app
      # Resend — free email
      - key: RESEND_API_KEY
        sync: false
      - key: EMAIL_FROM
        value: "Pantry <onboarding@resend.dev>"
      # Cloudinary — free image storage
      - key: CLOUDINARY_CLOUD_NAME
        sync: false
      - key: CLOUDINARY_API_KEY
        sync: false
      - key: CLOUDINARY_API_SECRET
        sync: false
    buildCommand: ""
    startCommand: >
      alembic upgrade head &&
      gunicorn app.main:app
      -k uvicorn.workers.UvicornWorker
      --workers 1 --bind 0.0.0.0:$PORT --timeout 60

  # ── Frontend (static site — free) ────────────────────────────────────────
  - type: web
    name: pantry-web
    runtime: static
    buildCommand: cd frontend && npm ci && npm run build
    staticPublishPath: ./frontend/dist
    envVars:
      - key: VITE_API_URL
        value: https://pantry-api.onrender.com/api/v1
    routes:
      - type: rewrite
        source: /*
        destination: /index.html

# Free PostgreSQL (expires after 90 days on Render free tier)
# Upgrade to Supabase for a permanent free Postgres — see docs/supabase.md
databases:
  - name: pantry-db
    plan: free
    databaseName: pantry
    user: pantry
